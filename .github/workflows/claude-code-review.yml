name: Claude Code Review

# Reusable (workflow_call) code review. It has no trigger of its own: each
# repository keeps a thin wrapper that owns the `pull_request` trigger and the
# `workflow_dispatch` entry point, and calls this with `secrets: inherit`.
#
# The review posts through the action's own tracking comment, which exists only
# for entity events (pull_request/issues/...). `workflow_dispatch` is an
# automation event, so on a dispatched run `track_progress: true` does not just
# get ignored — the action throws — and there is no comment to post into. The
# gate below covers that case: it asks the review for its markdown and posts it
# to the PR itself. Hence `track_progress` being an expression, not `true`.

on:
  workflow_call:
    inputs:
      pr:
        # string, not number: a caller passing `github.event.pull_request.number
        # || inputs.pr` hands this a string, and a number-typed input rejects it
        # outright -- "Unexpected value '2208'", raised while evaluating the
        # caller's inputs, so the run fails with no jobs at all and no log to
        # read. Nothing here needs it numeric: it only ever lands in a URL path,
        # the prompt text and an artifact name.
        description: "Pull request number to review."
        required: true
        type: string
      runs_on:
        description: "Runner label. unitysvc is self-hosted; the gateway repos are ubuntu-latest."
        required: false
        type: string
        default: ubuntu-latest
      pass_label:
        description: "Label applied when the review finds no blocker."
        required: false
        type: string
        default: review passed
      fail_label:
        description: "Label applied when the review finds a blocker."
        required: false
        type: string
        default: review failed
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Org-level Claude Code OAuth token. Callers normally pass this with `secrets: inherit`."
        required: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      # write, not read: track_progress has the action itself create and
      # update the tracking comment, under the workflow token.
      pull-requests: write
      # write, not read: the verdict gate below adds and removes the
      # `review passed` label, and labels are an issues-API resource
      # even on a pull request.
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the review reads `git blame` / `git log` on the
          # modified files to judge the change in its historical context.
          fetch-depth: 0
          # Always the merge ref: it is exactly what a pull_request run checks
          # out by default, and a dispatched run starts on the default branch
          # and has to be pointed at the PR explicitly. Stated unconditionally
          # because the `cond && '' || other` form does not do what it looks
          # like -- '' is falsy, so that expression yields `other` either way.
          # This ref does not exist while a PR has conflicts; rebase instead.
          ref: ${{ format('refs/pull/{0}/merge', inputs.pr) }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The command is of two minds about the no-findings case: step 6
          # says "do not proceed", while its own formatting notes give an
          # "if you found no issues" template. Both are obeyed in practice
          # (#2215 posted, #2214 stayed silent on an equally complete run),
          # so silence means nothing on its own. track_progress puts the
          # comment under the action's control instead of the model's.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: '/code-review:code-review ${{ github.repository }}#${{ inputs.pr }}'
          # Subagents are denied, not merely left off the allowlist. The command
          # instructs its step 4 to "launch 5 parallel agents"; the main agent
          # backgrounds them, and a headless session has no way to await
          # background work — it spends turns on ScheduleWakeup, which does
          # nothing here, and then reports `reviewed: false` having reviewed
          # nothing. Across every run observed, the split is total: the two that
          # produced a review spawned zero subagents, and all four that spawned
          # them (2-8 each, most backgrounded, always fewer completed than
          # spawned) abandoned the review. See unitysvc/unitysvc#2241.
          #
          # Denied rather than un-allowed because `Agent` and `ScheduleWakeup`
          # were both used on run 34776014114 without ever appearing in
          # --allowedTools: that list gates prompting, not availability.
          #
          # The system prompt is here so the model adapts deliberately instead
          # of discovering the denial mid-plan. It goes in claude_args, never in
          # `prompt:` — the slash command there is brittle enough already.
          #
          # Skill first: without it the slash command in `prompt` is denied and
          # never runs at all — Claude improvises a review from the prompt text
          # instead. Task next, because the command delegates every one of its
          # steps to a subagent. Then the git reads its steps 4c/4d need, which
          # its own frontmatter does not cover.
          #
          # The `gh` and `mcp__github__*` entries are what let the review read
          # the pull request at all. Without them its very first subagent is
          # permission-denied on `gh pr view` and on the curl it falls back to,
          # so it never reaches the step-4 review pass and returns a verdict
          # having reviewed nothing (runs 34770346433 and 34770347440). The
          # `gh` patterns mirror the plugin command's own frontmatter; the MCP
          # tools are the route that does not depend on `gh` being installed on
          # the runner, and pull in the action's GitHub MCP server (docker,
          # which these runners have — labeler.yml already uses a docker://
          # action).
          # NOTE: the --json-schema argument below is wrapped in SINGLE quotes,
          # so its text must never contain an apostrophe. One in a description
          # closes the quote early and the run dies with "--json-schema is not
          # valid JSON: Unterminated string" before Claude ever starts (runs
          # 34771695643 and 34771697435). Verify with shell tokenisation, never
          # by slicing the string -- slicing happily returns the whole schema
          # while the shell has already torn it in half.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_comments,mcp__github__get_pull_request_reviews,mcp__github__list_pull_requests,mcp__github__search_pull_requests,Skill,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*),Bash(git fetch:*)"
            --json-schema '{"type":"object","properties":{"reviewed":{"type":"boolean","description":"True only if you actually performed the code review: you read the changes in this pull request, ran the review over them, and posted your review comment. False if you stopped early for any reason at all -- the pull request was ineligible (closed, draft, trivial, already reviewed by you), a tool error or permission block kept you from reading the diff or the PR metadata, or you simply never got as far as posting a review comment. Never report a review you did not perform. When in doubt, false is always the correct answer: it is recorded as a run where no review happened, it is never held against the pull request, and it is far better than a review that silently did not run being read as a clean one.","default":false},"has_blocker":{"type":"boolean","description":"True if any issue in the review you just produced is a blocker. A blocker is a defect this pull request introduces that would be wrong to merge as-is: incorrect behaviour or a wrong result, data loss or corruption, a security or authorization hole, a breaking API/schema/migration change, or an explicit violation of a rule stated in a CLAUDE.md file. Judge severity here, not confidence -- you already dropped the findings you were not confident in. Lean towards true: when a reported issue is borderline, call it a blocker. A human can force-merge past a wrong failure, but a blocker that passes silently ships. False when you reported no issues at all, or only nitpicks, style points, optional suggestions, praise, or pre-existing problems this PR did not introduce. Meaningless unless reviewed is true.","default":false},"blockers":{"type":"array","description":"One entry per blocking issue, in the same order as the review comment. Empty when has_blocker is false.","items":{"type":"object","properties":{"file":{"type":"string","description":"Repo-relative path of the blocking issue, with a :line or :start-end suffix when known."},"summary":{"type":"string","description":"One sentence naming the defect and why merging it as-is would be wrong."}},"required":["file","summary"]}},"review_markdown":{"type":"string","description":"The full markdown body of the review you posted. On a manually dispatched run there is no comment for you to post into, and posting will not have been possible -- put the complete review here in that case and the workflow posts it to the pull request on your behalf. Empty string when no review happened.","default":""}},"required":["reviewed","has_blocker","blockers"]}'
            --disallowedTools "Task,Agent,ScheduleWakeup"
            --append-system-prompt "You are running headless in CI. Subagents and background work are unavailable to you: the Task, Agent and ScheduleWakeup tools are denied. Carry out every step of the code review yourself, inline, in this session, including any step whose instructions tell you to delegate it to a subagent. Never wait for background work to finish, because nothing will ever finish. Reviewing the change yourself is always better than reporting that no review happened."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Upload Claude execution log
        # Always: a run that posts nothing is exactly the one worth inspecting.
        # The action hides Claude's output from the job log by default, so
        # without this there is no way to tell a review that found nothing from
        # one that never got off the ground.
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-execution-${{ inputs.pr }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate on the review verdict
        # Only meaningful when the review itself completed; a crashed review
        # already fails the job above. `structured_output` is the
        # `--json-schema` result from the step above, and is the only place
        # the review's verdict is machine-readable — the action's own
        # `conclusion` output reports whether Claude ran, not what it found.
        env:
          REVIEW: ${{ steps.claude-review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          # `review passed`, deliberately not `ready to merge`: this gate sees
          # only the code review. It knows nothing about whether the tests, the
          # linter or the migration check passed, so it is in no position to
          # call a pull request mergeable. Ready-to-merge stays a human label;
          # this one means exactly "the code review found no blocker".
          PASS_LABEL: ${{ inputs.pass_label }}
          FAIL_LABEL: ${{ inputs.fail_label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTE_MARKER: "<!-- claude-review-gate -->"
          BODY_MARKER: "<!-- claude-review-body -->"
        run: |
          set -euo pipefail

          # curl + python3, never gh/jq: the self-hosted runners have neither
          # installed (same constraint as test-backend.yml's PR comment step).
          api() {
            method="$1"; path="$2"; shift 2
            curl -fsS -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}${path}" "$@"
          }

          # Every label mutation fires `labeled`/`unlabeled`, and both
          # labeler.yml and test-backend.yml trigger on those — a redundant
          # add or remove re-runs the whole backend suite. So read the
          # current labels first and only write when the state has to change.
          label_names='import json,sys; print("\n".join(l.get("name","") for l in json.load(sys.stdin)))'
          has() { printf '%s\n' "$LABELS" | grep -Fxq "$1" && echo yes || echo no; }
          if LABELS=$(api GET "/issues/${PR}/labels?per_page=100" | python3 -c "$label_names"); then
            HAS_PASS=$(has "$PASS_LABEL")
            HAS_FAIL=$(has "$FAIL_LABEL")
          else
            # Could not read them; fall back to attempting the writes, which
            # are harmless in both directions (add is idempotent, remove
            # tolerates a 404) at the cost of a possible redundant event.
            echo "::warning title=Code review::Could not read the PR labels."
            HAS_PASS=unknown
            HAS_FAIL=unknown
          fi

          # Labelling is reporting: a failed label call must never flip a clean
          # review to red, nor stop a blocking one from failing.
          add_label() {
            api POST "/issues/${PR}/labels" -d "{\"labels\":[\"$1\"]}" >/dev/null \
              || echo "::warning title=Code review::Could not add the '$1' label."
          }
          remove_label() {
            api DELETE "/issues/${PR}/labels/$(printf '%s' "$1" | sed 's/ /%20/g')" \
              >/dev/null 2>&1 || true
          }
          # Only ever write on a real transition: see the note above about
          # label events restarting the backend suite.
          set_label() {  # set_label <name> <present?> <wanted>
            if [ "$3" = yes ] && [ "$2" != yes ]; then add_label "$1"
            elif [ "$3" = no ] && [ "$2" != no ]; then remove_label "$1"
            fi
          }

          # A review that gives up part-way leaves its tracking comment frozen
          # at "in progress" while the action prepends "Claude finished" and
          # this check goes green — nothing on the PR says the code was never
          # reviewed (run 34772294580 on #2232). So the gate keeps one
          # marker-matched note of its own: posted when no review happened,
          # deleted as soon as one does. Never write the trigger phrase for
          # claude.yml into it, or every note starts a second workflow.
          note_id() {  # note_id <marker>
            api GET "/issues/${PR}/comments?per_page=100" 2>/dev/null \
              | python3 -c "$note_finder" "$1" 2>/dev/null || true
          }
          upsert_note() {  # upsert_note <file> <marker>
            python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1]).read()}))' "$1" \
              > "${RUNNER_TEMP}/note.json"
            existing=$(note_id "$2")
            if [ -n "$existing" ]; then
              api PATCH "/issues/comments/${existing}" -d @"${RUNNER_TEMP}/note.json" >/dev/null 2>&1 \
                || echo "::warning title=Code review::Could not update the review-status note."
            else
              api POST "/issues/${PR}/comments" -d @"${RUNNER_TEMP}/note.json" >/dev/null 2>&1 \
                || echo "::warning title=Code review::Could not post the review-status note."
            fi
          }
          clear_note() {  # clear_note <marker>
            existing=$(note_id "$1")
            [ -n "$existing" ] && api DELETE "/issues/comments/${existing}" >/dev/null 2>&1 || true
          }

          # One line, like label_names above: a multi-line script here would sit
          # at column 0 inside this block scalar and break the YAML.
          note_finder='import json,sys; m=sys.argv[1]; print(next((str(c["id"]) for c in json.load(sys.stdin) if m in (c.get("body") or "")), ""))'

          # On a dispatched run the action is in agent mode: no tracking comment
          # exists (the comment server hard-requires CLAUDE_COMMENT_ID), so the
          # review had nowhere to post and handed us its markdown instead.
          # Marker-matched and edited in place, so repeated dispatches on one PR
          # keep a single comment rather than stacking.
          post_review_body() {
            [ "${{ github.event_name }}" = "pull_request" ] && return 0
            [ -s "${RUNNER_TEMP}/review.md" ] || return 0
            {
              printf '%s\n\n' "$BODY_MARKER"
              cat "${RUNNER_TEMP}/review.md"
            } > "${RUNNER_TEMP}/body.md"
            upsert_note "${RUNNER_TEMP}/body.md" "$BODY_MARKER"
          }

          cat > "${RUNNER_TEMP}/verdict.py" <<'VERDICT_PY'
          import json, os, sys

          try:
              d = json.loads(sys.stdin.read())
              if not isinstance(d, dict):
                  raise ValueError
          except Exception:
              # No verdict at all: crash, or schema drift.
              print("unknown")
              sys.exit(0)

          # A review that never ran reports has_blocker=false just like a clean
          # one does, so "no findings" is not on its own evidence of anything.
          # Only a self-declared completed review is allowed to speak.
          if d.get("reviewed") is not True:
              print("unknown")
              sys.exit(0)

          with open(os.path.join(os.environ["RUNNER_TEMP"], "review.md"), "w") as fh:
              body = d.get("review_markdown")
              fh.write(body if isinstance(body, str) else "")

          blockers = d.get("blockers")
          if not isinstance(blockers, list):
              blockers = []

          # Either signal blocks: has_blocker is the model's own call, and a non-empty
          # list catches a run that fills in the findings but leaves the flag false.
          if d.get("has_blocker") is True or blockers:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("### Code review: blocking findings\n\n")
                  for b in blockers:
                      if isinstance(b, dict):
                          fh.write("- `{}` - {}\n".format(b.get("file", "?"), b.get("summary", "")))
                  fh.write("\nForce-merge if the review is wrong; the full review is in the PR comment.\n")
              print("blocked")
          else:
              print("clean")
          VERDICT_PY

          VERDICT=$(printf '%s' "${REVIEW:-}" | python3 "${RUNNER_TEMP}/verdict.py")

          case "$VERDICT" in
            unknown)
              # No review happened, or none that said so: an eligibility
              # bail-out, a crash, or a run that could not read the PR. Not
              # evidence either way, so the job passes and the label is left
              # exactly as a human left it. The execution log uploaded above
              # is how these runs are told apart from real ones.
              echo "::warning title=Code review::No completed review to gate on; leaving labels alone. Check the uploaded execution log."
              {
                printf '%s\n\n' "$NOTE_MARKER"
                echo "### This pull request was not reviewed"
                echo
                echo "The code review did not complete, so this check is **not** gating and the labels were left as they were. A green check here does not mean the change was reviewed."
                echo
                echo "Known causes: the review judged the PR ineligible, it could not read the PR, or it abandoned the review part-way. In that last case its own progress comment stays frozen part-ticked, which is why it can look like a review is still running long after the job finished."
                echo
                echo "The transcript is in the claude-review-execution-${PR} artifact on [this run](${RUN_URL}). Push again, or re-run the job, to retry the review."
              } > "${RUNNER_TEMP}/note.md"
              cat "${RUNNER_TEMP}/note.md" >> "$GITHUB_STEP_SUMMARY"
              upsert_note "${RUNNER_TEMP}/note.md" "$NOTE_MARKER"
              ;;
            clean)
              echo "No blocking findings."
              clear_note "$NOTE_MARKER"
              post_review_body
              # The two are mutually exclusive: whichever verdict this run
              # reached, the opposite label from an earlier run is now wrong.
              # This workflow re-runs on every push, so a stale pass sitting on
              # a revision that has since grown a blocker is worse than none.
              set_label "$PASS_LABEL" "$HAS_PASS" yes
              set_label "$FAIL_LABEL" "$HAS_FAIL" no
              ;;
            blocked)
              echo "Blocking findings; see the step summary."
              clear_note "$NOTE_MARKER"
              post_review_body
              set_label "$FAIL_LABEL" "$HAS_FAIL" yes
              set_label "$PASS_LABEL" "$HAS_PASS" no
              exit 1
              ;;
          esac
